[package]
name = "rs_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "emulator"
crate-type = ["cdylib", "rlib"]

[package.metadata.maturin]
generate-python-stubs = true

[dependencies]
bitflags = "2.10.0"
thiserror = "2.0.18"
pyo3 = { version = "0.28" }

[features]
# Enabled automatically by maturin when building the Python extension module.
# Left off for `cargo test` so the test binaries link against libpython instead
# of an unresolved Python extension module.
extension-module = ["pyo3/extension-module"]
